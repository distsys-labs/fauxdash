name: publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to (re-)publish'
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      # npm's OIDC trusted publishing needs npm >=11.5.1; Node 22's bundled
      # npm (10.x as of this writing) predates it, so with no NODE_AUTH_TOKEN
      # configured (by design - that's the point of trusted publishing) the
      # publish silently falls back to unauthenticated and fails with a 404.
      - run: npm install -g npm@latest

      - run: npm ci

      - run: npm run build --if-present

      - run: npm test

      - run: npm publish --provenance
